<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punktskrift Braille Press tests</title>
<link rel="stylesheet" href="../css/site.css">
<style>
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
h1{margin:0 0 6px;font-weight:600;font-size:1.8rem}
#sum{margin:0 0 24px;color:var(--muted);font-style:italic}
.suite{margin:0 0 10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.suite.bad{border-color:var(--bad)}
.suite p{margin:0;display:flex;justify-content:space-between;gap:12px}
.suite .n{color:var(--muted);font-style:italic}
.suite ul{margin:8px 0 0;padding:0 0 0 18px;color:var(--bad);font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Punktskrift Braille Press tests</h1>
  <p id="sum">Running…</p>
  <div id="out"></div>
</main>
<!-- Opens straight from disk: no server needed. -->
<script src="../js/tables.js"></script>
<script src="../js/braille.js"></script>
<script src="../js/lessons.js"></script>
<script src="cases.js"></script>
<script>
const suites = [];
function suite(name, run) {
  const failures = [];
  let count = 0;
  run((ok, message) => { count++; if (!ok) failures.push(message); });
  suites.push({ name, count, failures });
}

// "6 125 | 1" → the Unicode braille toUnicode() should give
function fromDots(expected) {
  return expected.split(" / ").map(line => line.split(" | ").map(word =>
    word.split(" ").map(cell => cell.startsWith("=") ? cell.slice(1) : cellChar(cell)).join("")
  ).join("⠀")).join("\n");
}

// Unicode braille back to dot numbers, so a failure reads like the cases
function toDots(braille) {
  return braille.split("\n").map(line => line.split("⠀").map(word => [...word].map(ch => {
    const code = ch.charCodeAt(0) - 0x2800;
    if (code < 0 || code > 63) return "=" + ch;
    return [1, 2, 3, 4, 5, 6].filter(dot => code & (1 << (dot - 1))).join("");
  }).join(" ")).join(" | ")).join(" / ");
}

suite("Every table cell is a real braille cell, and no two letters share one", check => {
  for (const [id, table] of Object.entries(BRAILLE_TABLES)) {
    const problems = tableProblems(table);
    check(problems.length === 0, `${id}: ${problems.join("; ")}`);
  }
});

suite("Every language has known translations", check => {
  for (const id of Object.keys(BRAILLE_TABLES)) check(CASES[id] && CASES[id].length > 0, `${id} has no cases`);
});

for (const [id, cases] of Object.entries(CASES)) {
  suite(`${BRAILLE_TABLES[id] ? BRAILLE_TABLES[id].name : id}: known translations`, check => {
    for (const [text, expected] of cases) {
      const got = toUnicode(translate(text, BRAILLE_TABLES[id]));
      check(got === fromDots(expected), `${JSON.stringify(text)} gave ${toDots(got)}, expected ${expected}`);
    }
  });
}

suite("Indicator cells say what they are, so the page can explain them", check => {
  const roles = (text, id) => translate(text, BRAILLE_TABLES[id]).lines.flat(2)
    .map(glyph => glyph.role).filter(role => !["letter", "digit", "sign"].includes(role)).join(" ");
  for (const [text, id, expected] of [
    ["Hi", "en", "cap"], ["NASA", "en", "capsWord"], ["ABCs", "en", "capsWord capsEnd"],
    ["THIS IS LOUD", "en", "capsPhrase capsEnd"], ["3a", "en", "num let"],
    ["ÄRGER", "de", "capsWord"], ["PKOs", "pl", "cap cap cap"],
  ]) {
    const got = roles(text, id);
    check(got === expected, `${id} ${JSON.stringify(text)} gave ${got}, expected ${expected}`);
  }
});

suite("Drill levels: every level has items, each a real cell, none sharing a cell", check => {
  for (const [id, table] of Object.entries(BRAILLE_TABLES)) {
    const list = levels(table);
    check(list.length >= 6, `${id} has only ${list.length} levels`);
    for (const level of list) {
      check(level.items.length > 0, `${id} ${level.id} is empty`);
      const keys = new Set();
      for (const it of level.items) {
        check(isCell(it.cell), `${id} ${level.id} ${it.print}: "${it.cell}" is not one cell`);
        check(!keys.has(it.key), `${id} ${level.id}: two items on ${it.key}`);
        keys.add(it.key);
      }
    }
    for (const letter of table.alphabet) check(table.letters[letter], `${id}: alphabet letter ${letter} has no cell`);
    const first = list[0].items.map(it => it.print).join("");
    check(first === "abcdefghij", `${id} starts with ${first}`);
  }
});

suite("The levels follow braille's own pattern: k–t are a–j plus dot 3, u v x y z are a–e plus dots 3 and 6", check => {
  const plus = (cell, dots) => [...new Set(cell + dots)].sort().join("");
  for (let k = 0; k < 10; k++) {
    const a = "abcdefghij"[k], b = "klmnopqrst"[k];
    check(BASE_LETTERS[b] === plus(BASE_LETTERS[a], "3"), `${b} is not ${a} plus dot 3`);
  }
  [..."uvxyz"].forEach((u, k) => check(BASE_LETTERS[u] === plus(BASE_LETTERS["abcde"[k]], "36"), `${u} is not ${"abcde"[k]} plus dots 3 and 6`));
});

suite("Reading a cell back gives what was written", check => {
  for (const [id, table] of Object.entries(BRAILLE_TABLES)) {
    for (const level of levels(table)) {
      for (const it of level.items) {
        const prints = lettersFor(table, it.cell).map(meaning => meaning.print);
        check(prints.includes(it.print), `${id}: ${it.cell} doesn't read back as ${it.print} (got ${prints.join(" ")})`);
      }
    }
  }
  check(lettersFor(BRAILLE_TABLES.en, "3456").some(m => m.print === "number sign"), "3456 is not the number sign in English");
});

suite("Wrong answers on offer are close cells from the same level", check => {
  let seed = 1;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const [id, table] of Object.entries(BRAILLE_TABLES)) {
    for (const level of levels(table)) {
      for (const it of level.items) {
        const offered = neighbours(it, level.items, 3, random);
        const want = Math.min(3, level.items.length - 1);
        check(offered.length === want, `${id} ${level.id} ${it.print}: ${offered.length} choices, expected ${want}`);
        check(offered.every(o => o.key !== it.key && level.items.includes(o)), `${id} ${level.id} ${it.print}: a choice repeats the answer or comes from elsewhere`);
        check(new Set(offered.map(o => o.key)).size === offered.length, `${id} ${level.id} ${it.print}: the same choice twice`);
      }
    }
  }
  const near = neighbours(levels(BRAILLE_TABLES.en)[0].items[3], levels(BRAILLE_TABLES.en)[0].items, 3, random);
  check(near.every(o => dotDistance(o.cell, "145") <= 2), `d's neighbours are far: ${near.map(o => o.print).join(" ")}`);
});

suite("Unknown characters are reported once each", check => {
  const result = translate("a ☃ b ☃ €", BRAILLE_TABLES.en);
  check(result.unknown.join("") === "☃", `got ${JSON.stringify(result.unknown)}`);
});

const out = document.getElementById("out");
let failed = 0, total = 0;
for (const { name, count, failures } of suites) {
  total += count;
  failed += failures.length;
  const box = document.createElement("section");
  box.className = "suite" + (failures.length ? " bad" : "");
  box.innerHTML = `<p><span></span><span class="n"></span></p>`;
  box.querySelector("span").textContent = name;
  box.querySelector(".n").textContent = failures.length ? `${failures.length} of ${count} failed` : `${count} passed`;
  if (failures.length) {
    const list = document.createElement("ul");
    failures.forEach(message => { const item = document.createElement("li"); item.textContent = message; list.append(item); });
    box.append(list);
  }
  out.append(box);
}
document.getElementById("sum").textContent = failed ? `${failed} of ${total} checks failed` : `All ${total} checks pass`;
document.title = (failed ? "FAIL " : "PASS ") + document.title;
</script>
</body>
</html>

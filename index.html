<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19110c" media="(prefers-color-scheme: dark)">
<title>Piotrek's Punktskrift Press</title>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/press.css">
</head>
<body>
<nav class="nav" aria-label="Punktskrift Press"><div class="in">
  <a class="brand" href="index.html" aria-current="page">Punktskrift Press</a>
  <span class="aside">uncontracted braille</span>
</div></nav>
<main>
  <header class="mast">
    <h1>Piotrek's Punktskrift Press</h1>
    <p class="sub">Write a sentence, and the press embosses it in braille.</p>
  </header>

  <form id="press" class="slip" autocomplete="off">
    <span class="lbl" id="lang-label">Braille of</span>
    <div class="seg" id="langs" role="radiogroup" aria-labelledby="lang-label"></div>
    <label class="lbl" for="text">Your sentence</label>
    <textarea id="text" rows="3" spellcheck="false" placeholder="Hello, Piotrek."></textarea>
    <button type="submit" class="primary" id="go">Press</button>
  </form>

  <section class="sheet-wrap" aria-label="Braille page">
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="show-print" checked> Show the print under each cell</label>
    </div>
    <div class="sheet" id="sheet"></div>
    <p class="note" id="note" hidden></p>
    <p class="sr" id="reader" aria-live="polite"></p>
  </section>
</main>
<footer class="foot">By Peter S</footer>
<script src="js/tables.js"></script>
<script src="js/braille.js"></script>
<script src="js/press.js"></script>
</body>
</html>
